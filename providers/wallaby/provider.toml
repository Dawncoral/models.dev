# OpenAI-compatible API focused on Kimi K3. Reasoning is always-on and streams
# in the `reasoning_content` field; `reasoning_effort` is accepted but currently
# has no observable effect (see model file note). `temperature` is accepted but
# normalized to 1.
# https://wallabytoken.com/docs (accessed 2026-09-28)
name = "Wallaby"
npm = "@ai-sdk/openai-compatible"
env = ["WALLABY_API_KEY"]
api = "https://api.wallabytoken.com/v1"
doc = "https://wallabytoken.com/docs"
